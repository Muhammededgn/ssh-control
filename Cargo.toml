[package]
name = "ssh-control"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.0"
argon2 = "0.5.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
getrandom = "0.4.3"
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.30.2"
russh = "0.62.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "io-std", "signal", "io-util", "sync"] }
totp-rs = { version = "5.7.2", features = ["gen_secret", "otpauth", "zeroize"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"
